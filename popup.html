<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Community Keeper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon-32.png" alt="" aria-hidden="true">
          <div>
            <p class="eyebrow">Daily Assistant</p>
            <h1>Community Keeper</h1>
            <p id="statusText">准备执行</p>
            <p id="currentSiteText" class="site-hint">正在识别当前页面</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="refreshButton" class="icon-button" type="button" title="重置界面">↻</button>
        </div>
      </header>

      <section class="batch-panel" aria-label="批量执行">
        <div>
          <p class="batch-kicker">Batch Runner</p>
          <h2>选择平台后顺序执行</h2>
          <p>先确认平台，再打开独立窗口展示执行过程。</p>
        </div>
        <button id="runAllButton" class="batch-button" type="button">执行全部</button>
      </section>

      <section class="platforms" aria-label="平台任务">
        <div class="platform-card" data-platform-card="v2ex">
          <button class="platform-button" type="button" data-platform="v2ex">
            <span class="platform-info">
              <span class="platform-mark">
                <img src="icons/platforms/v2ex.png" alt="" aria-hidden="true">
              </span>
              <span>
                <strong>V2EX</strong>
                <small>每日登录奖励</small>
              </span>
            </span>
            <span class="button-state" data-state-for="v2ex">待执行</span>
          </button>
          <button class="open-button" type="button" data-open-platform="v2ex">打开</button>
        </div>

        <div class="platform-card" data-platform-card="nodeseek">
          <button class="platform-button" type="button" data-platform="nodeseek">
            <span class="platform-info">
              <span class="platform-mark">
                <img src="icons/platforms/nodeseek.png" alt="" aria-hidden="true">
              </span>
              <span>
                <strong>NodeSeek</strong>
                <small>每日签到</small>
              </span>
            </span>
            <span class="button-state" data-state-for="nodeseek">待执行</span>
          </button>
          <button class="open-button" type="button" data-open-platform="nodeseek">打开</button>
        </div>

        <div class="platform-card" data-platform-card="linuxdo">
          <button class="platform-button" type="button" data-platform="linuxdo">
            <span class="platform-info">
              <span class="platform-mark">
                <img src="icons/platforms/linuxdo.png" alt="" aria-hidden="true">
              </span>
              <span>
                <strong>LinuxDo</strong>
                <small>登录校验和浏览</small>
              </span>
            </span>
            <span class="button-state" data-state-for="linuxdo">待执行</span>
          </button>
          <button class="open-button" type="button" data-open-platform="linuxdo">打开</button>
        </div>

        <div class="platform-card" data-platform-card="naixi">
          <button class="platform-button" type="button" data-platform="naixi">
            <span class="platform-info">
              <span class="platform-mark">
                <img src="icons/platforms/naixi.png" alt="" aria-hidden="true">
              </span>
              <span>
                <strong>奶昔论坛</strong>
                <small>每日签到</small>
              </span>
            </span>
            <span class="button-state" data-state-for="naixi">待执行</span>
          </button>
          <button class="open-button" type="button" data-open-platform="naixi">打开</button>
        </div>
      </section>

      <section class="result-panel" aria-label="执行结果">
        <div class="result-heading">
          <h2>最近结果</h2>
          <div class="result-actions">
            <button id="copyButton" type="button">复制</button>
            <button id="clearButton" type="button">清空</button>
          </div>
        </div>
        <pre id="resultOutput">暂无记录</pre>
      </section>
      <footer class="footer-links">
        <span id="versionText"></span>
        <button id="projectButton" class="author-link" type="button" aria-label="打开 GitHub 项目">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.67 0 8.2c0 3.62 2.29 6.69 5.47 7.78.4.08.55-.18.55-.4 0-.2-.01-.85-.01-1.54-2.01.38-2.53-.5-2.69-.96-.09-.24-.48-.96-.82-1.16-.28-.15-.68-.52-.01-.53.63-.01 1.08.59 1.23.84.72 1.24 1.87.89 2.33.68.07-.53.28-.89.51-1.1-1.78-.21-3.64-.91-3.64-4.04 0-.89.31-1.63.82-2.2-.08-.21-.36-1.05.08-2.17 0 0 .67-.22 2.2.84A7.42 7.42 0 0 1 8 3.97c.68 0 1.36.09 2 .27 1.53-1.06 2.2-.84 2.2-.84.44 1.12.16 1.96.08 2.17.51.57.82 1.3.82 2.2 0 3.14-1.87 3.83-3.65 4.04.29.26.54.75.54 1.52 0 1.1-.01 1.99-.01 2.26 0 .22.15.48.55.4A8.1 8.1 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z"/>
          </svg>
          <span>@JackyST0</span>
        </button>
      </footer>

      <div id="batchDialog" class="dialog-backdrop" hidden>
        <section class="dialog-card" role="dialog" aria-modal="true" aria-labelledby="batchDialogTitle">
          <div class="dialog-heading">
            <div>
              <p class="batch-kicker">Batch Runner</p>
              <h2 id="batchDialogTitle">选择要执行的平台</h2>
            </div>
            <button id="batchDialogClose" class="dialog-close" type="button" aria-label="关闭">×</button>
          </div>

          <div class="batch-options">
            <label class="batch-option">
              <input type="checkbox" value="v2ex" checked>
              <img src="icons/platforms/v2ex.png" alt="" aria-hidden="true">
              <span>
                <strong>V2EX</strong>
                <small>每日登录奖励</small>
              </span>
            </label>

            <label class="batch-option">
              <input type="checkbox" value="nodeseek" checked>
              <img src="icons/platforms/nodeseek.png" alt="" aria-hidden="true">
              <span>
                <strong>NodeSeek</strong>
                <small>每日签到</small>
              </span>
            </label>

            <label class="batch-option">
              <input type="checkbox" value="linuxdo" checked>
              <img src="icons/platforms/linuxdo.png" alt="" aria-hidden="true">
              <span>
                <strong>LinuxDo</strong>
                <small>登录校验和浏览</small>
              </span>
            </label>

            <label class="batch-option">
              <input type="checkbox" value="naixi" checked>
              <img src="icons/platforms/naixi.png" alt="" aria-hidden="true">
              <span>
                <strong>奶昔论坛</strong>
                <small>每日签到</small>
              </span>
            </label>
          </div>

          <p id="batchDialogHint" class="dialog-hint">将按勾选顺序逐个平台执行，不并发，不绕过登录或安全检查。</p>

          <div class="dialog-actions">
            <button id="batchCancelButton" type="button">取消</button>
            <button id="batchStartButton" class="primary" type="button">开始执行</button>
          </div>
        </section>
      </div>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
