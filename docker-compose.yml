services:
  web:
    build: .
    image: community-keeper:latest
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      TZ: Asia/Shanghai
      COMMUNITY_KEEPER_RUNTIME: process
      COMMUNITY_KEEPER_ENV_FILE: /data/community-keeper.env
      COMMUNITY_KEEPER_LOG_FILE: /var/log/community-keeper/run.log
      COMMUNITY_KEEPER_PID_FILE: /data/community-keeper.pid
      COMMUNITY_KEEPER_SCHEDULER_ENABLED_FILE: /data/scheduler.enabled
      COMMUNITY_KEEPER_SCHEDULER_STATE_FILE: /data/scheduler.state
      INSTALL_DIR: /app
      PYTHON_BIN: /usr/local/bin/python
      PIP_BIN: /usr/local/bin/pip
      AUTO_UPDATE: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "123456"
      ADMIN_SESSION_SECRET: "community-keeper-default-session-secret"
      ADMIN_COOKIE_SECURE: "false"
    volumes:
      - ./data:/data
      - ./logs:/var/log/community-keeper

  scheduler:
    image: community-keeper:latest
    restart: unless-stopped
    depends_on:
      - web
    command: ["python", "-m", "web.scheduler"]
    environment:
      TZ: Asia/Shanghai
      COMMUNITY_KEEPER_RUNTIME: process
      COMMUNITY_KEEPER_ENV_FILE: /data/community-keeper.env
      COMMUNITY_KEEPER_LOG_FILE: /var/log/community-keeper/run.log
      COMMUNITY_KEEPER_PID_FILE: /data/community-keeper.pid
      COMMUNITY_KEEPER_SCHEDULER_ENABLED_FILE: /data/scheduler.enabled
      COMMUNITY_KEEPER_SCHEDULER_STATE_FILE: /data/scheduler.state
      COMMUNITY_KEEPER_SCHEDULER_ENABLED: "true"
      COMMUNITY_KEEPER_RUN_TIME: "00:10"
      COMMUNITY_KEEPER_RANDOM_DELAY_SECONDS: "600"
      INSTALL_DIR: /app
      PYTHON_BIN: /usr/local/bin/python
      PIP_BIN: /usr/local/bin/pip
      AUTO_UPDATE: "false"
    volumes:
      - ./data:/data
      - ./logs:/var/log/community-keeper
