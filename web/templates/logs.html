{% extends "base.html" %}
{% block title %}日志 - community-keeper{% endblock %}
{% block content %}
<section class="hero">
  <div>
    <h1>实时日志</h1>
    <p class="muted">任务输出会按平台分组展示，方便快速查看每个平台的执行结果。</p>
  </div>
  <form method="get" action="/logs" class="inline-form">
    <label>
      行数
      <input name="lines" value="{{ lines }}" type="number" min="20" max="1000">
    </label>
    <button type="submit">刷新</button>
    <label>
      <input id="auto-refresh" type="checkbox" checked>
      实时刷新
    </label>
  </form>
</section>

<section class="card log-card">
  <div class="log-toolbar">
    <div class="log-title">
      <span class="terminal-dot red"></span>
      <span class="terminal-dot yellow"></span>
      <span class="terminal-dot green"></span>
      <div>
        <strong>community-keeper.log</strong>
        <span class="log-subtitle">实时任务输出</span>
      </div>
    </div>
    <div class="log-meta">
      <span id="refresh-status" class="status-pill live">实时中</span>
      <span id="last-updated" class="muted">刚刚更新</span>
    </div>
  </div>
  <div id="logs-output" class="logs"></div>
  <script id="initial-logs" type="application/json">{{ logs | tojson }}</script>
</section>

<script>
(() => {
  const output = document.getElementById("logs-output");
  const autoRefresh = document.getElementById("auto-refresh");
  const linesInput = document.querySelector('input[name="lines"]');
  const refreshStatus = document.getElementById("refresh-status");
  const lastUpdated = document.getElementById("last-updated");
  const initialLogs = document.getElementById("initial-logs");
  let lastText = JSON.parse(initialLogs.textContent || '""');

  function scrollToBottom() {
    output.scrollTop = output.scrollHeight;
  }

  function lineTone(line, level) {
    const normalizedLevel = (level || "").toLowerCase();
    if (normalizedLevel === "success") {
      return "success";
    }
    if (normalizedLevel === "warning") {
      return "warning";
    }
    if (normalizedLevel === "error") {
      return "error";
    }
    if (line.includes("| SUCCESS |") || line.includes(" succeeded")) {
      return "success";
    }
    if (line.includes("| WARNING |") || line.includes(" skipped") || line.includes("跳过")) {
      return "warning";
    }
    if (line.includes("| ERROR |") || line.includes("failed") || line.includes("error:")) {
      return "error";
    }
    if (line.includes("| INFO ") || line.includes("Starting")) {
      return "info";
    }
    return "plain";
  }

  function parseLine(line) {
    const loguruMatch = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+\|\s+([A-Z]+)\s+\|\s+(.+)$/);
    if (loguruMatch) {
      const detail = loguruMatch[3];
      const sourceMatch = detail.match(/^([^:]+:\d+)\s+-\s+(.+)$/);
      return {
        time: loguruMatch[1],
        level: loguruMatch[2],
        source: sourceMatch ? sourceMatch[1] : "",
        message: sourceMatch ? sourceMatch[2] : detail,
      };
    }

    const bracketMatch = line.match(/^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]\s*(.*)$/);
    if (bracketMatch) {
      return {
        time: bracketMatch[1],
        level: "SYSTEM",
        source: "runtime",
        message: bracketMatch[2],
      };
    }

    return {
      time: "",
      level: "",
      source: "",
      message: line,
    };
  }

  const logGroups = [
    { key: "system", title: "系统与调度", icon: "⚙", hint: "启动、调度、运行摘要" },
    { key: "nodeseek", title: "NodeSeek", icon: "N", hint: "NodeSeek 签到与账号信息" },
    { key: "linuxdo", title: "LinuxDo", icon: "L", hint: "LinuxDo 登录、浏览、Connect" },
    { key: "v2ex", title: "V2EX", icon: "V", hint: "V2EX 每日签到" },
    { key: "naixi", title: "奶昔论坛", icon: "奶", hint: "奶昔论坛签到" },
    { key: "other", title: "其他日志", icon: "·", hint: "未归类输出" },
  ];

  function groupForLine(line, parsed) {
    const text = `${parsed.source || ""} ${parsed.message || ""} ${line || ""}`.toLowerCase();
    if (text.includes("runtime task summary")) {
      return "system";
    }
    if (text.includes("nodeseek")) {
      return "nodeseek";
    }
    if (text.includes("linuxdo")) {
      return "linuxdo";
    }
    if (text.includes("v2ex")) {
      return "v2ex";
    }
    if (text.includes("naixi") || text.includes("奶昔")) {
      return "naixi";
    }
    if (
      text.includes("scheduler")
      || text.includes("runtime")
      || text.includes("run.sh")
      || text.includes("starting manual")
      || text.includes("starting code")
      || text.includes("display is empty")
    ) {
      return "system";
    }
    return "other";
  }

  function createLogRow(line, parsed) {
    const row = document.createElement("div");
    row.className = `log-line ${lineTone(line, parsed.level)}`;

    const time = document.createElement("span");
    time.className = "log-time";
    time.textContent = parsed.time || " ";

    const level = document.createElement("span");
    level.className = `log-level ${lineTone(line, parsed.level)}`;
    level.textContent = parsed.level || "LOG";

    const source = document.createElement("span");
    source.className = "log-source";
    source.textContent = parsed.source || " ";

    const message = document.createElement("span");
    message.className = "log-message";
    message.textContent = parsed.message || " ";

    row.append(time, level, source, message);
    return row;
  }

  function renderLogs(text) {
    output.replaceChildren();
    const fragment = document.createDocumentFragment();
    const buckets = new Map(logGroups.map((group) => [group.key, []]));

    for (const line of text.split("\n")) {
      const parsed = parseLine(line);
      const groupKey = groupForLine(line, parsed);
      buckets.get(groupKey).push({ line, parsed });
    }

    for (const group of logGroups) {
      const entries = buckets.get(group.key).filter(({ line }) => line.trim());
      if (!entries.length) {
        continue;
      }

      const section = document.createElement("section");
      section.className = `log-section ${group.key}`;

      const header = document.createElement("div");
      header.className = "log-section-header";

      const left = document.createElement("div");
      left.className = "log-section-title";

      const icon = document.createElement("span");
      icon.className = "log-section-icon";
      icon.textContent = group.icon;

      const titleWrap = document.createElement("div");
      const title = document.createElement("strong");
      title.textContent = group.title;
      const hint = document.createElement("span");
      hint.textContent = group.hint;
      titleWrap.append(title, hint);
      left.append(icon, titleWrap);

      const count = document.createElement("span");
      count.className = "log-section-count";
      count.textContent = `${entries.length} 条`;

      header.append(left, count);
      section.appendChild(header);

      const body = document.createElement("div");
      body.className = "log-section-body";
      for (const entry of entries) {
        body.appendChild(createLogRow(entry.line, entry.parsed));
      }
      section.appendChild(body);
      fragment.appendChild(section);
    }

    output.appendChild(fragment);
  }

  function updateStatus(text, isLive = true) {
    refreshStatus.textContent = isLive ? "实时中" : "已暂停";
    refreshStatus.className = isLive ? "status-pill live" : "status-pill paused";
    lastUpdated.textContent = text;
  }

  async function refreshLogs() {
    if (!autoRefresh.checked) {
      updateStatus("自动刷新已暂停", false);
      return;
    }
    const lines = Math.max(20, Math.min(Number(linesInput.value || 200), 1000));
    const response = await fetch(`/logs/text?lines=${lines}`, {
      headers: { "Accept": "text/plain" },
      cache: "no-store",
    });
    if (!response.ok) {
      updateStatus("刷新失败");
      return;
    }
    const text = await response.text();
    if (text !== lastText) {
      const nearBottom = output.scrollTop + output.clientHeight >= output.scrollHeight - 24;
      renderLogs(text);
      lastText = text;
      if (nearBottom) {
        scrollToBottom();
      }
    }
    updateStatus(new Date().toLocaleTimeString());
  }

  renderLogs(lastText);
  scrollToBottom();
  autoRefresh.addEventListener("change", () => {
    updateStatus(autoRefresh.checked ? "已恢复实时刷新" : "自动刷新已暂停", autoRefresh.checked);
    if (autoRefresh.checked) {
      refreshLogs();
    }
  });
  setInterval(refreshLogs, 2000);
})();
</script>
{% endblock %}
