{% extends "base.html" %}
{% block title %}日志 - community-keeper{% endblock %}
{% block content %}
<section class="hero">
  <div>
    <h1>实时日志</h1>
    <p class="muted">任务输出会按平台分组展示，方便快速查看每个平台的执行结果。</p>
  </div>
  <form method="get" action="/logs" class="inline-form">
    <label>
      行数
      <input name="lines" value="{{ lines }}" type="number" min="20" max="1000">
    </label>
    <button type="submit">刷新</button>
    <label>
      <input id="auto-refresh" type="checkbox" checked>
      实时刷新
    </label>
  </form>
</section>

<section class="card log-card">
  <div class="log-toolbar">
    <div class="log-title">
      <span class="terminal-dot red"></span>
      <span class="terminal-dot yellow"></span>
      <span class="terminal-dot green"></span>
      <div>
        <strong>签到结果</strong>
        <span class="log-subtitle">只显示每个平台本次执行情况</span>
      </div>
    </div>
    <div class="log-meta">
      <span id="refresh-status" class="status-pill live">实时中</span>
      <span id="last-updated" class="muted">刚刚更新</span>
    </div>
  </div>
  <div id="logs-output" class="logs"></div>
  <script id="initial-logs" type="application/json">{{ logs | tojson }}</script>
</section>

<script>
(() => {
  const output = document.getElementById("logs-output");
  const autoRefresh = document.getElementById("auto-refresh");
  const linesInput = document.querySelector('input[name="lines"]');
  const refreshStatus = document.getElementById("refresh-status");
  const lastUpdated = document.getElementById("last-updated");
  const initialLogs = document.getElementById("initial-logs");
  let lastText = JSON.parse(initialLogs.textContent || '""');

  function scrollToBottom() {
    output.scrollTop = output.scrollHeight;
  }

  function lineTone(line, level) {
    const normalizedLevel = (level || "").toLowerCase();
    if (normalizedLevel === "success") {
      return "success";
    }
    if (normalizedLevel === "warning") {
      return "warning";
    }
    if (normalizedLevel === "error") {
      return "error";
    }
    if (line.includes("| SUCCESS |") || line.includes(" succeeded")) {
      return "success";
    }
    if (line.includes("| WARNING |") || line.includes(" skipped") || line.includes("跳过")) {
      return "warning";
    }
    if (line.includes("| ERROR |") || line.includes("failed") || line.includes("error:")) {
      return "error";
    }
    if (line.includes("| INFO ") || line.includes("Starting")) {
      return "info";
    }
    return "plain";
  }

  function parseLine(line) {
    const loguruMatch = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+\|\s+([A-Z]+)\s+\|\s+(.+)$/);
    if (loguruMatch) {
      const detail = loguruMatch[3];
      const sourceMatch = detail.match(/^([^:]+:\d+)\s+-\s+(.+)$/);
      return {
        time: loguruMatch[1],
        level: loguruMatch[2],
        source: sourceMatch ? sourceMatch[1] : "",
        message: sourceMatch ? sourceMatch[2] : detail,
      };
    }

    const bracketMatch = line.match(/^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]\s*(.*)$/);
    if (bracketMatch) {
      return {
        time: bracketMatch[1],
        level: "SYSTEM",
        source: "runtime",
        message: bracketMatch[2],
      };
    }

    return {
      time: "",
      level: "",
      source: "",
      message: line,
    };
  }

  function formatTime(value) {
    if (!value) {
      return "";
    }
    const timePart = value.split(" ")[1] || value;
    return timePart.replace(/\.\d+$/, "");
  }

  const platforms = [
    { key: "nodeseek", name: "NodeSeek", icon: "NS", cookieName: "NODESEEK_COOKIE" },
    { key: "linuxdo", name: "LinuxDo", icon: "LD", cookieName: "LINUXDO_COOKIES" },
    { key: "v2ex", name: "V2EX", icon: "VX", cookieName: "V2EX_COOKIE" },
    { key: "naixi", name: "奶昔论坛", icon: "NX", cookieName: "NAIXI_COOKIE" },
  ];

  function platformText(platform, line, parsed) {
    return `${parsed.source || ""} ${parsed.message || ""} ${line || ""}`.toLowerCase();
  }

  function emptyStatus(platform) {
    return {
      platform,
      state: "pending",
      label: "未运行",
      detail: "还没有看到这个平台的执行结果",
      time: "",
    };
  }

  function summarizePlatform(platform, parsedLines) {
    const status = emptyStatus(platform);
    for (const item of parsedLines) {
      const text = platformText(platform, item.line, item.parsed);
      if (!text.includes(platform.key) && !text.includes(platform.name.toLowerCase())) {
        continue;
      }
      const message = item.parsed.message || item.line;
      status.time = formatTime(item.parsed.time) || status.time;

      if (text.includes("failed") || text.includes("失败") || text.includes("error")) {
        status.state = "failed";
        status.label = "失败";
        status.detail = cleanDetail(message);
      } else if (text.includes("skipped") || text.includes("跳过") || text.includes("未配置")) {
        status.state = "skipped";
        status.label = "已跳过";
        status.detail = cleanDetail(message);
      } else if (
        text.includes("completed")
        || text.includes("succeeded")
        || text.includes("签到成功")
        || text.includes("已完成签到")
        || text.includes("今天已完成签到")
      ) {
        status.state = "success";
        status.label = "已签到";
        status.detail = cleanDetail(message);
      } else if (text.includes("starting") || text.includes("开始执行")) {
        status.state = status.state === "pending" ? "running" : status.state;
        status.label = status.state === "running" ? "运行中" : status.label;
        status.detail = status.state === "running" ? "正在执行任务" : status.detail;
      }
    }
    return status;
  }

  function cleanDetail(message) {
    return message
      .replace(/^(.+) skipped: /, "")
      .replace(/^(.+) completed: /, "")
      .replace(/^NodeSeek attendance succeeded via browser: /, "")
      .replace(/^(.+) failed: /, "")
      .trim() || "已完成";
  }

  function renderPlatformStatus(status) {
    const card = document.createElement("section");
    card.className = `platform-result ${status.platform.key} ${status.state}`;

    const icon = document.createElement("span");
    icon.className = "platform-result-icon";
    icon.textContent = status.platform.icon;

    const body = document.createElement("div");
    body.className = "platform-result-body";

    const name = document.createElement("strong");
    name.textContent = status.platform.name;

    body.appendChild(name);
    if (status.state === "failed") {
      const detail = document.createElement("span");
      detail.textContent = status.detail;
      body.appendChild(detail);
    }

    const meta = document.createElement("div");
    meta.className = "platform-result-meta";

    const label = document.createElement("span");
    label.className = `platform-status ${status.state}`;
    label.textContent = status.label;
    meta.appendChild(label);

    if (status.time) {
      const time = document.createElement("span");
      time.className = "platform-time";
      time.textContent = status.time;
      meta.appendChild(time);
    }

    card.append(icon, body, meta);
    return card;
  }

  function renderLogs(text) {
    output.replaceChildren();
    const fragment = document.createDocumentFragment();
    const parsedLines = text
      .split("\n")
      .filter((line) => line.trim())
      .map((line) => ({ line, parsed: parseLine(line) }));

    const title = document.createElement("div");
    title.className = "platform-results-title";
    title.textContent = "本次签到结果";
    fragment.appendChild(title);

    platforms.forEach((platform, index) => {
      fragment.appendChild(renderPlatformStatus(summarizePlatform(platform, parsedLines)));
      if (index < platforms.length - 1) {
        const divider = document.createElement("div");
        divider.className = "platform-divider";
        divider.textContent = "----------------------------------------";
        fragment.appendChild(divider);
      }
    });

    output.appendChild(fragment);
  }

  function updateStatus(text, isLive = true) {
    refreshStatus.textContent = isLive ? "实时中" : "已暂停";
    refreshStatus.className = isLive ? "status-pill live" : "status-pill paused";
    lastUpdated.textContent = text;
  }

  async function refreshLogs() {
    if (!autoRefresh.checked) {
      updateStatus("自动刷新已暂停", false);
      return;
    }
    const lines = Math.max(20, Math.min(Number(linesInput.value || 200), 1000));
    const response = await fetch(`/logs/text?lines=${lines}`, {
      headers: { "Accept": "text/plain" },
      cache: "no-store",
    });
    if (!response.ok) {
      updateStatus("刷新失败");
      return;
    }
    const text = await response.text();
    if (text !== lastText) {
      const nearBottom = output.scrollTop + output.clientHeight >= output.scrollHeight - 24;
      renderLogs(text);
      lastText = text;
      if (nearBottom) {
        scrollToBottom();
      }
    }
    updateStatus(new Date().toLocaleTimeString());
  }

  renderLogs(lastText);
  scrollToBottom();
  autoRefresh.addEventListener("change", () => {
    updateStatus(autoRefresh.checked ? "已恢复实时刷新" : "自动刷新已暂停", autoRefresh.checked);
    if (autoRefresh.checked) {
      refreshLogs();
    }
  });
  setInterval(refreshLogs, 2000);
})();
</script>
{% endblock %}
