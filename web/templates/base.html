<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}community-keeper{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">community-keeper</a>
    {% if username %}
      <nav>
        <a href="/">运行状态</a>
        <a href="/config">配置</a>
        <a href="/logs">日志</a>
      </nav>
      <form method="post" action="/logout">
        <button class="link-button" type="submit">退出 {{ username }}</button>
      </form>
    {% endif %}
  </header>

  <main class="container">
    {% if flash and flash.message %}
      <div class="flash {{ flash.category }}">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
