{% extends "base.html" %}
{% block title %}登录 - community-keeper{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>登录管理后台</h1>
  {% if not auth_ready %}
    <p class="muted">
      还没有配置 <code>ADMIN_PASSWORD</code> 或 <code>ADMIN_PASSWORD_HASH</code>。
      Docker Compose 快速启动默认会提供 <code>admin/123456</code>。
    </p>
  {% endif %}
  <form method="post" action="/login" class="form">
    <label>
      用户名
      <input name="username" value="admin" autocomplete="username" required>
    </label>
    <label>
      密码
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">登录</button>
  </form>
</section>
{% endblock %}
