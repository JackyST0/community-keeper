{% extends "base.html" %}
{% block title %}运行状态 - community-keeper{% endblock %}
{% block content %}
<section class="hero">
  <div>
    <h1>运行状态</h1>
    <p class="muted">配置文件：<code>{{ env_file }}</code></p>
  </div>
  <div class="actions">
    <form method="post" action="/actions/start"><button type="submit">手动运行一次</button></form>
    <form method="post" action="/actions/update"><button type="submit">更新代码/依赖</button></form>
    <form method="post" action="/actions/stop"><button class="danger" type="submit">停止运行</button></form>
  </div>
</section>

<section class="grid">
  <article class="card">
    <h2>定时器</h2>
    <div class="actions">
      <form method="post" action="/actions/enable-timer"><button type="submit">启用定时器</button></form>
      <form method="post" action="/actions/disable-timer"><button class="secondary" type="submit">停用定时器</button></form>
    </div>
    <pre>{{ timer_status }}</pre>
  </article>
  <article class="card">
    <h2>下次运行</h2>
    <pre>{{ next_runs }}</pre>
  </article>
</section>

<section class="card">
  <h2>服务状态</h2>
  <pre>{{ service_status }}</pre>
</section>
{% endblock %}
